<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Craft Track</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8A2E3F">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Craft Track">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F3F0;--surface:#FFFFFF;--surface-2:#FAFAF8;
    --text:#1B1A18;--dim:#6E6B66;--faint:#9C988F;
    --border:#E7E5E0;--border-2:#DAD7D0;
    --accent:#8A2E3F;--accent-h:#722634;--accent-soft:#F5EBEC;--ring:rgba(138,46,63,.22);
    --shadow:0 1px 2px rgba(24,22,20,.05),0 6px 20px rgba(24,22,20,.05);
    --shadow-lg:0 12px 40px rgba(24,22,20,.14);
    --r:14px;--r-sm:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text)}
  body{font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding:0 0 100px;font-size:15px;line-height:1.45}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  button{font-family:inherit}

  header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 22px}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand h1{font-family:"Fraunces",serif;font-weight:600;font-size:30px;letter-spacing:-.01em}
  .brand .tag{font-size:13px;color:var(--faint)}
  .header-right{display:flex;align-items:center;gap:14px}
  .lang-btn{appearance:none;background:none;border:1px solid var(--border-2);border-radius:8px;color:var(--dim);cursor:pointer;font-size:12px;font-weight:700;padding:5px 9px;letter-spacing:.05em;transition:.15s}
  .lang-btn:hover{border-color:var(--accent);color:var(--accent)}
  .career{text-align:right}
  .career .num{font-family:"Fraunces",serif;font-weight:600;font-size:26px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
  .career .lbl{font-size:11px;color:var(--faint);margin-top:3px;letter-spacing:.02em}

  .tabrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:5px;width:fit-content}
  .tab{appearance:none;background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--dim);padding:9px 20px;border-radius:8px;transition:.15s}
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--accent);color:#fff}
  .view-toggle{display:flex;gap:4px}
  .vtbtn{appearance:none;background:none;border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--faint);font-size:15px;line-height:1;transition:.15s}
  .vtbtn.active{background:var(--surface);color:var(--text);border-color:var(--border-2);box-shadow:var(--shadow)}
  .vtbtn:hover{color:var(--text)}

  .view{display:none}
  .view.active{display:block}

  .qlog{position:relative;display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:8px;padding:0 14px}
  .qlog:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
  .qlog-ic{color:var(--accent);flex:none}
  .qlog input{flex:1;border:none;background:none;color:var(--text);font-family:inherit;font-size:15px;padding:15px 12px}
  .qlog input:focus{outline:none}
  .qlog input::placeholder{color:var(--faint)}
  .qlog-spin{flex:none;padding-right:4px}

  .logfeed{margin-bottom:16px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
  .logentry{display:flex;gap:10px;padding:7px 12px;font-size:13px;color:var(--dim);background:var(--surface-2)}
  .logentry+.logentry{border-top:1px solid var(--border)}
  .log-time{font-family:"Fraunces",serif;font-size:12px;color:var(--faint);flex:0 0 36px;padding-top:1px}
  .log-text{flex:1;line-height:1.4}

  .logview-day{margin-bottom:28px}
  .logview-date{font-family:"Fraunces",serif;font-size:13px;font-weight:600;color:var(--faint);text-transform:capitalize;letter-spacing:.02em;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:6px}
  .logview-entry{display:flex;gap:14px;align-items:baseline;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);margin-top:5px;box-shadow:var(--shadow)}
  .logview-time{font-family:"Fraunces",serif;font-size:13px;color:var(--faint);flex:0 0 38px}
  .logview-text{font-size:14px;color:var(--text);line-height:1.5;flex:1}
  .logview-empty{padding:60px 20px;text-align:center;color:var(--faint);font-size:14px}

  #authScreen{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:32px 28px;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
  .auth-brand{font-family:"Fraunces",serif;font-size:26px;font-weight:600;color:var(--accent);margin-bottom:4px}
  .auth-sub{font-size:13px;color:var(--faint);margin-bottom:28px}
  .auth-err{background:#FEF2F3;border:1px solid #F5C0C6;border-radius:8px;color:var(--accent);font-size:13px;padding:10px 12px;margin-bottom:14px;display:none}
  .auth-info{background:#F0F7F4;border:1px solid #A8D5C2;border-radius:8px;color:#1D6648;font-size:13px;padding:12px 14px;margin-bottom:14px;display:none;line-height:1.5}
  .auth-toggle{font-size:13px;color:var(--dim);margin-top:18px;text-align:center}
  .auth-toggle a{color:var(--accent);cursor:pointer;font-weight:500}
  .auth-toggle a:hover{text-decoration:underline}
  .auth-signout-btn{appearance:none;background:none;border:1px solid var(--border-2);border-radius:8px;color:var(--dim);cursor:pointer;font-size:12px;font-weight:700;padding:5px 9px;letter-spacing:.05em;transition:.15s;display:none}
  .auth-signout-btn:hover{border-color:var(--accent);color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);display:flex;align-items:center;gap:16px;background:#1B1A18;color:#F4F3F0;border-radius:12px;padding:13px 16px 13px 18px;box-shadow:var(--shadow-lg);z-index:90;opacity:0;transition:transform .3s ease,opacity .3s ease;max-width:calc(100% - 32px)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast-msg{font-size:14px}
  .toast-undo{appearance:none;background:none;border:none;color:#E9A6B0;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;flex:none}
  .toast-undo:hover{color:#fff}

  .ask-text{font-size:14.5px;color:var(--dim);margin-bottom:18px;line-height:1.5}
  .ask-text b{color:var(--text)}
  .ask-opts{display:flex;flex-direction:column;gap:8px}
  .ask-opt{display:flex;align-items:center;gap:11px;font-size:14px;color:var(--text);cursor:pointer;padding:12px 14px;border:1px solid var(--border-2);border-radius:10px;transition:.14s}
  .ask-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .ask-opt input{accent-color:var(--accent);width:16px;height:16px}
  .ask-select{width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:inherit;font-size:15px;padding:11px 12px;margin-top:10px}
  .ask-select:disabled{opacity:.4}
  .ask-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;align-items:start}
  .ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
  .ccard.cat{grid-column:1/-1}
  .kebab{position:absolute;top:14px;right:12px;appearance:none;background:none;border:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:6px;transition:.15s}
  .kebab:hover{color:var(--text);background:var(--surface-2)}
  .clabel{font-size:14px;font-weight:600;color:var(--text);padding-right:28px}
  .cbig{font-family:"Fraunces",serif;font-weight:600;font-size:52px;line-height:1;margin:10px 0 16px;font-variant-numeric:tabular-nums;transition:color .15s}
  .cbig[data-act]{cursor:pointer}
  .cbig[data-act]:hover{color:var(--accent)}
  .cbig.tick{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.1);color:var(--accent)}100%{transform:scale(1)}}

  .cstep{display:flex;gap:10px;margin-top:auto}
  .step{appearance:none;border:1px solid var(--border-2);background:var(--surface);color:var(--text);height:44px;border-radius:var(--r-sm);cursor:pointer;font-size:22px;font-weight:500;line-height:1;display:grid;place-items:center;transition:.14s;-webkit-tap-highlight-color:transparent;user-select:none}
  .step:hover{border-color:var(--accent);color:var(--accent)}
  .step:active{transform:translateY(1px)}
  .step.minus{flex:0 0 52px}
  .step.plus{flex:1;background:var(--accent);border-color:var(--accent);color:#fff;font-size:24px}
  .step.plus:hover{background:var(--accent-h);border-color:var(--accent-h);color:#fff}
  .step.plus.holding{opacity:.5;transform:scale(.97)}

  .sublist{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
  .subrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--border)}
  .subname{font-size:14px;color:var(--text);font-weight:500}
  .subctrl{display:flex;align-items:center;gap:4px}
  .sbtn{appearance:none;width:30px;height:30px;border:1px solid var(--border-2);background:var(--surface);border-radius:8px;color:var(--dim);cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;transition:.14s;user-select:none;-webkit-tap-highlight-color:transparent}
  .sbtn:hover{border-color:var(--accent);color:var(--accent)}
  .sbtn.plus{background:var(--accent);border-color:var(--accent);color:#fff}
  .sbtn.plus:hover{background:var(--accent-h)}
  .sbtn.plus.holding{opacity:.5}
  .subcount{font-family:"Fraunces",serif;font-weight:600;font-size:18px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer;transition:color .15s}
  .subcount:hover{color:var(--accent)}
  .subcount.tick{animation:pop .3s ease}

  .addtype{appearance:none;background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;padding:6px 0 0;text-align:left;transition:.15s}
  .addtype:hover{color:var(--accent-h)}
  .addtype-box{margin-top:10px;position:relative;display:none}
  .addtype-box.open{display:block}
  .addtype-box input{width:100%;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px}
  .addtype-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}

  .addcard{background:none;border:1.5px dashed var(--border-2);color:var(--dim);border-radius:var(--r);min-height:120px;cursor:pointer;font-size:14px;font-weight:600;display:grid;place-items:center;transition:.15s}
  .addcard:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  .grid.list{display:flex;flex-direction:column;gap:6px}
  .grid.list .ccard,.grid.list .ccard.cat{grid-column:unset;flex-direction:row;align-items:center;padding:11px 14px;gap:12px}
  .grid.list .clabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:0}
  .grid.list .cbig{font-size:26px;margin:0;min-width:50px;text-align:right}
  .grid.list .cstep{margin-top:0;flex:none}
  .grid.list .step{height:38px}
  .grid.list .step.minus{flex:0 0 44px}
  .grid.list .kebab{position:static;flex:none}
  .grid.list .sublist,.grid.list .addtype,.grid.list .addtype-box{display:none}

  .searchwrap{position:relative;margin-bottom:14px}
  .searchbox{position:relative}
  .searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .searchbox input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:16px;padding:15px 16px 15px 46px;box-shadow:var(--shadow)}
  .searchbox input::placeholder{color:var(--faint)}
  .searchbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}

  .dd{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;display:none;overflow:hidden;max-height:380px;overflow-y:auto}
  .dd.open{display:block}
  .dd-head{padding:11px 16px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--border)}
  .ri{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;cursor:pointer;transition:background .12s}
  .ri:hover{background:var(--surface-2)}
  .ri+.ri{border-top:1px solid var(--border)}
  .ri-main{min-width:0}
  .ri-name{font-size:15px;font-weight:600;color:var(--text)}
  .ri-meta{font-size:13px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ri-add{flex:none;color:var(--accent);font-size:13px;font-weight:600}
  .ri-status{display:flex;align-items:center;gap:10px;padding:14px 16px;color:var(--dim);font-size:14px;cursor:default}
  .spin{width:15px;height:15px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .wsum{font-size:13px;color:var(--dim);margin-bottom:14px}
  .wsum b{color:var(--accent);font-weight:600}
  .winelist{display:flex;flex-direction:column;gap:10px}
  .wrow{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);flex-wrap:wrap}
  .winfo{flex:1 1 200px;min-width:0}
  .wname{font-family:"Fraunces",serif;font-size:20px;font-weight:600;line-height:1.15}
  .wmeta{font-size:13px;color:var(--dim);margin-top:5px}
  .wmeta .vint{color:var(--accent);font-weight:600}
  .wmeta .novint{color:var(--accent);font-weight:600;cursor:pointer}
  .wmeta .sep{color:var(--border-2);margin:0 7px}
  .wsteps{display:flex;align-items:center;gap:14px}
  .stepblock{text-align:center}
  .steplabel{font-size:11px;color:var(--faint);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .stepctrl{display:flex;align-items:center;gap:6px}
  .tnum{font-family:"Fraunces",serif;font-weight:600;font-size:20px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
  .tnum.tick{animation:pop .3s ease}
  .wedit{appearance:none;background:none;border:none;color:var(--faint);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:6px;transition:.15s}
  .wedit:hover{color:var(--text);background:var(--surface-2)}

  .addwine{margin-top:16px;background:none;border:1.5px dashed var(--border-2);color:var(--dim);border-radius:var(--r);padding:15px;width:100%;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
  .addwine:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}

  .ac{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);z-index:80;display:none;max-height:200px;overflow:auto}
  .ac-item{padding:9px 13px;font-size:14px;cursor:pointer;color:var(--dim)}
  .ac-item:hover,.ac-item.on{background:var(--surface-2);color:var(--text)}

  .scrim{position:fixed;inset:0;background:rgba(24,22,20,.4);backdrop-filter:blur(2px);display:none;place-items:center;padding:20px;z-index:50}
  .scrim.open{display:grid}
  .modal{background:var(--surface);border-radius:18px;width:100%;max-width:420px;padding:28px 26px 24px;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
  .modal h2{font-family:"Fraunces",serif;font-weight:600;font-size:23px;margin-bottom:22px}
  .field{margin-bottom:16px;position:relative}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:7px}
  .field input{width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--text);font-family:inherit;font-size:15px;padding:12px 13px}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);background:var(--surface)}
  .row2{display:flex;gap:12px}
  .row2 .field{flex:1}
  .mactions{display:flex;gap:10px;margin-top:24px;align-items:center}
  .btn{appearance:none;border:none;border-radius:var(--r-sm);cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;padding:12px 20px;transition:.15s}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-h)}
  .btn.ghost{background:var(--surface-2);border:1px solid var(--border-2);color:var(--dim)}
  .btn.ghost:hover{color:var(--text)}
  .btn.del{background:none;color:var(--faint);margin-left:auto;padding:12px 6px}
  .btn.del:hover{color:var(--accent)}
  .loading{padding:80px 0;text-align:center;color:var(--faint);font-size:14px}

  .numtray{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:2px solid var(--border-2);padding:14px 20px 28px;display:flex;align-items:center;gap:12px;z-index:95;box-shadow:0 -4px 24px rgba(24,22,20,.12);transform:translateY(100%);transition:transform .22s ease}
  .numtray.open{transform:translateY(0)}
  .numtray-label{font-size:13px;color:var(--dim);white-space:nowrap;flex:none;max-width:160px;overflow:hidden;text-overflow:ellipsis}
  .numtray input{flex:1;border:1px solid var(--border-2);background:var(--surface-2);border-radius:var(--r-sm);color:var(--text);font-family:"Fraunces",serif;font-size:32px;font-weight:600;padding:8px 12px;text-align:right;font-variant-numeric:tabular-nums;min-width:0}
  .numtray input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
  .numtray-ok{appearance:none;border:none;background:var(--accent);color:#fff;border-radius:var(--r-sm);font-family:inherit;font-size:15px;font-weight:600;padding:12px 18px;cursor:pointer;flex:none;transition:.15s}
  .numtray-ok:hover{background:var(--accent-h)}
  .numtray-cancel{appearance:none;border:1px solid var(--border-2);background:none;color:var(--dim);border-radius:var(--r-sm);font-family:inherit;font-size:20px;padding:8px 12px;cursor:pointer;flex:none;line-height:1;transition:.15s}
  .numtray-cancel:hover{color:var(--text)}

  @media (max-width:560px){
    .wrap{padding:0 16px}
    .grid{grid-template-columns:1fr 1fr;gap:12px}
    .ccard.cat{grid-column:1/-1}
    .cbig{font-size:42px}
    .wsteps{width:100%;justify-content:space-between}
    .career .num{font-size:22px}
    .numtray-label{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Craft Track</h1><span class="tag" id="tagline"></span></div>
    <div class="header-right">
      <button id="signOutBtn" class="auth-signout-btn"></button>
      <button id="langBtn" class="lang-btn">EN</button>
      <div class="career"><div class="num" id="careerNum">0</div><div class="lbl" id="totalLbl"></div></div>
    </div>
  </header>

  <div class="qlog">
    <svg class="qlog-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v4M3 5h4M6 17v4M4 19h4"/><path d="M13 3 16 10l7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>
    <input id="qlogInput" autocomplete="off">
    <span class="qlog-spin" id="qlogSpin" hidden><span class="spin"></span></span>
  </div>

  const DRUER=["Pinot Noir","Chardonnay","Cabernet Sauvignon","Merlot","Syrah","Shiraz","Sangiovese","Nebbiolo","Tempranillo","Garnacha","Grenache","Gamay","Riesling","Sauvignon Blanc","Chenin Blanc","Pinot Grigio","Pinot Gris","Gewürztraminer","Viognier","Mourvèdre","Barbera","Dolcetto","Malbec","Cabernet Franc","Carignan","Nerello Mascalese","Corvina","Verdejo","Albarïo","Grüner Veltliner","Touriga Nacional","Furmint","Assyrtiko"];

  function clone(o){return JSON.parse(JSON.stringify(o));}
  function seedFor(label){const l=(label||"").toLowerCase();if(/østers|oyster/.test(l))return OYSTER_TYPES.slice();if(/løg/.test(l))return LOEG_TYPER.slice();if(/vin|flaske/.test(l))return VIN_TYPER.slice();return [];}

  const DEFAULTS={
    counters:[
      {id:id(),label:"Østers åbnet",count:0,subs:[],suggest:seedFor("Østers åbnet")},

  function saveSession(data){
    session={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+data.expires_in*1000};
    localStorage.setItem("mise_session",JSON.stringify(session));

  async function supabaseAuth(path,body){
    const res=await fetch(cfg.supabaseUrl+"/auth/v1/"+path,{method:"POST",headers:{"Content-Type":"application/json","apikey":cfg.anonKey},body:JSON.stringify(body)});
    return res.json();
  }

  async function signIn(email,password){
    const data=await supabaseAuth("token?grant_type=password",{email,password});
    if(data.access_token){saveSession(data);return null;}
    return data.error_description||data.msg||data.message||"Forkert email eller adgangskode";
  }

  async function signUp(email,password){
    const data=await supabaseAuth("signup",{email,password});
    if(data.access_token){saveSession(data);return null;}
    if(data.id&&!data.access_token)return{info:lang==="da"?"Vi har sendt en bekræftelsesmail til "+email+". Klik på linket i mailen og log derefter ind her.":"We've sent a confirmation email to "+email+". Click the link in the email, then log in here."};
    return data.error_description||data.msg||data.message||"Fejl ved oprettelse";
  }

  async function refreshSession(){
    if(!session||!session.refresh_token)return false;
    const data=await supabaseAuth("token?grant_type=refresh_token",{refresh_token:session.refresh_token});
    if(data.access_token){saveSession(data);return true;}
    session=null;localStorage.removeItem("mise_session");return false;
  }

  async function getToken(){
    if(!session)return null;
    if(Date.now()>session.expires_at-60000){const ok=await refreshSession();if(!ok)return null;}
    return session.access_token;
  }

  function showAuthScreen(){

  }

  function hideAuthScreen(){
    $("#authScreen").style.display="none";
    document.querySelector(".wrap").style.display="";
    $("#signOutBtn").style.display="";
  }

  async function initAuth(){
    try{const res=await fetch("/api/config");cfg=await res.json();}catch(e){console.warn("Config fetch fejlede",e);}
    if(!session){showAuthScreen();return false;}
    if(Date.now()>session.expires_at-60000){const ok=await refreshSession();if(!ok){showAuthScreen();return false;}}
    try{await fetch("/api/user/profile",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token}});}catch(e){}
    hideAuthScreen();return true;
  }

  function setupAuthForm(){
    const emailEl=$("#authEmail"),pwEl=$("#authPw"),submitBtn=$("#authSubmit"),errEl=$("#authErr"),toggleLink=$("#authToggleLink");
    function updateMode(){
      const isLogin=authMode==="login";
      $("#authSub").textContent=isLogin?t("auth_sub_login"):t("auth_sub_signup");
      submitBtn.textContent=isLogin?t("auth_login"):t("auth_signup");
      $("#authToggleText").textContent=isLogin?t("auth_no_account"):t("auth_have_account");
      toggleLink.textContent=isLogin?t("auth_create"):t("auth_to_login");
      pwEl.autocomplete=isLogin?"current-password":"new-password";
      errEl.style.display="none";$("#authInfo").style.display="none";
    }
    toggleLink.addEventListener("click",()=>{authMode=authMode==="login"?"signup":"login";updateMode();});
    submitBtn.addEventListener("click",async()=>{
      const email=emailEl.value.trim(),pw=pwEl.value;if(!email||!pw)return;
      submitBtn.disabled=true;submitBtn.textContent="…";
      const result=authMode==="login"?await signIn(email,pw):await signUp(email,pw);
      submitBtn.disabled=false;updateMode();
      if(result&&result.info){
        $("#authInfo").textContent=result.info;$("#authInfo").style.display="block";
        $("#authErr").style.display="none";
        emailEl.value="";pwEl.value="";
        authMode="login";updateMode();
        return;
      }
      if(result){$("#authErr").textContent=result;$("#authErr").style.display="block";return;}
      try{await fetch("/api/user/profile",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token}});}catch(e){}
      hideAuthScreen();startApp();
    });
    [emailEl,pwEl].forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter")submitBtn.click();}));
    $("#signOutBtn").addEventListener("click",()=>{session=null;localStorage.removeItem("mise_session");showAuthScreen();});
    updateMode();
  }

  async function syncLogEntry(categoryLabel,delta){

    const token=await getToken();if(!token)return;
    try{await fetch(base+"/api/log-entry",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({categoryLabel,delta})});}catch(e){}
  }

    s.counters=(s.counters||[]).map(c=>({id:c.id||id(),label:c.label||"",count:c.count||0,subs:Array.isArray(c.subs)?c.subs.map(x=>({id:x.id||id(),name:x.name||"",count:x.count||0})):[],suggest:(Array.isArray(c.suggest)&&c.suggest.length)?c.suggest:seedFor(c.label)}));
    s.wines=(s.wines||[]).map(w=>({id:w.id||id(),name:w.name||"",producer:w.producer||"",land:w.land||"",region:w.region||"",grape:w.grape||"",vint:w.vint||"",glasses:w.glasses||0,bottles:w.bottles||0}));
    s.log=Array.isArray(s.log)?s.log.filter(e=>e&&e.ts&&e.text):[];
    return s;
  }
  function counterTotal(c){return c.subs.length?c.subs.reduce((a,b)=>a+b.count,0):c.count;}

  // ---- log ----
  function addLogEntry(msg){
    const now=new Date();
    const time=now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");
    logHistory.unshift({time,msg});if(logHistory.length>8)logHistory.pop();renderLogFeed();
    if(!Array.isArray(state.log))state.log=[];
    state.log.unshift({ts:now.getTime(),text:msg});
    if(state.log.length>2000)state.log.length=2000;
    save();renderLogView();
  }
  function renderLogFeed(){
    const feed=$("#logFeed");if(!logHistory.length){feed.hidden=true;return;}
    feed.hidden=false;
    feed.innerHTML=logHistory.map(e=>'<div class="logentry"><span class="log-time">'+esc(e.time)+'</span><span class="log-text">'+esc(e.msg)+'</span></div>').join("");
  }
  function renderLogView(){
    const el=$("#logView");if(!el)return;
    const entries=state.log||[];
    if(!entries.length){el.innerHTML='<div class="logview-empty">'+esc(t("log_empty"))+'</div>';return;}
    const days=[],dayMap={};
    entries.forEach(e=>{
      const d=new Date(e.ts);
      const key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
      if(!dayMap[key]){
        const loc=lang==="en"?"en-GB":"da-DK";
        const label=d.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
        dayMap[key]={label,entries:[]};days.push(dayMap[key]);
      }
      const hh=new Date(e.ts).getHours().toString().padStart(2,"0");
      const mm=new Date(e.ts).getMinutes().toString().padStart(2,"0");
      dayMap[key].entries.push({t:hh+":"+mm,text:e.text});
    });
    el.innerHTML=days.map(day=>'<div class="logview-day"><div class="logview-date">'+esc(day.label)+'</div>'+day.entries.map(e=>'<div class="logview-entry"><span class="logview-time">'+esc(e.t)+'</span><span class="logview-text">'+esc(e.text)+'</span></div>').join("")+'</div>').join("");
  }

  // ---- autocomplete ----
  function attachAC(input,getList){
    if(input._acBound)return;input._acBound=true;
    const dd=document.createElement("div");dd.className="ac";input.parentNode.appendChild(dd);
    let items=[],active=-1;
    function close(){dd.style.display="none";dd.innerHTML="";active=-1;items=[];}
    function render(){const q=input.value.trim().toLowerCase();if(!q){close();return;}
      items=getList().filter(s=>s.toLowerCase().includes(q)).sort((a,b)=>{const A=a.toLowerCase().startsWith(q)?0:1,B=b.toLowerCase().startsWith(q)?0:1;return A-B||a.localeCompare(b,"da");}).slice(0,7);
      if(!items.length){close();return;}
      dd.innerHTML=items.map((m,i)=>'<div class="ac-item'+(i===active?" on":"")+'" data-i="'+i+'">'+esc(m)+'</div>').join("");dd.style.display="block";}
    function pick(v){input.value=v;close();}
    input.addEventListener("input",()=>{active=-1;render();});
    input.addEventListener("focus",render);
    input.addEventListener("blur",()=>setTimeout(close,140));
    input.addEventListener("keydown",e=>{if(dd.style.display!=="block")return;if(e.key==="ArrowDown"){e.preventDefault();active=Math.min(items.length-1,active+1);render();}else if(e.key==="ArrowUp"){e.preventDefault();active=Math.max(0,active-1);render();}else if(e.key==="Enter"&&active>=0){e.preventDefault();pick(items[active]);}else if(e.key==="Escape"){close();}});
    dd.addEventListener("mousedown",e=>{const it=e.target.closest(".ac-item");if(it){e.preventDefault();pick(items[+it.dataset.i]);}});
  }
  function uniq(arr){const seen=new Set(),out=[];arr.forEach(v=>{v=(v||"").trim();const k=v.toLowerCase();if(v&&!seen.has(k)){seen.add(k);out.push(v);}});return out;}
  function wineSuggest(field){return uniq([...({land:LANDE,region:OMRAADER,grape:DRUER}[field]||[]),...state.wines.map(w=>w[field])]);}

  // ---- long press ----
  function bindLongPress(btn,onLong){
    if(btn._lpBound)return;btn._lpBound=true;
    let t1=null,t2=null;
    btn.addEventListener("pointerdown",()=>{
      t1=setTimeout(()=>btn.classList.add("holding"),200);
      t2=setTimeout(()=>{t1=t2=null;btn.classList.remove("holding");btn._longPressed=true;onLong();},500);
    });
    function cancel(){clearTimeout(t1);clearTimeout(t2);t1=t2=null;btn.classList.remove("holding");}
    btn.addEventListener("pointerup",cancel);btn.addEventListener("pointercancel",cancel);
    btn.addEventListener("contextmenu",e=>e.preventDefault());
  }

  function bumpSimple(card,d){const c=state.counters.find(x=>x.id===card.dataset.id);if(!c||c.subs.length)return;c.count=Math.max(0,c.count+d);const n=card.querySelector(".cbig");n.textContent=c.count;if(d>0)tickEl(n);renderCareer();save();}
  function bumpSub(card,sid,d){const c=state.counters.find(x=>x.id===card.dataset.id);if(!c)return;const s=c.subs.find(x=>x.id===sid);if(!s)return;s.count=Math.max(0,s.count+d);const p=card.querySelector('.subrow[data-sid="'+sid+'"] .subcount');if(p){p.textContent=s.count;if(d>0)tickEl(p);}const tv=card.querySelector(".cbig");if(tv){tv.textContent=counterTotal(c);if(d>0)tickEl(tv);}renderCareer();save();}
  function addType(card,name){const c=state.counters.find(x=>x.id===card.dataset.id);if(!c)return;name=name.trim();if(!name)return;const ex=c.subs.find(s=>s.name.toLowerCase()===name.toLowerCase());if(ex){ex.count++;}else{if(c.subs.length===0&&c.count>0){c.subs.push({id:id(),name:"Uden type",count:c.count});c.count=0;}c.subs.push({id:id(),name,count:0});if(!c.suggest.some(s=>s.toLowerCase()===name.toLowerCase()))c.suggest.push(name);}save();renderCounters();renderCareer();}

  function sumHtml(shown){let g=0,b=0;shown.forEach(w=>{g+=w.glasses;b+=w.bottles;});return '<b>'+shown.length+'</b> '+(lang==="en"?(shown.length===1?"wine":"wines"):"vine")+'&nbsp;·&nbsp; <b>'+g+'</b> '+t("glasses").toLowerCase()+'&nbsp;·&nbsp; <b>'+b+'</b> '+t("bottles").toLowerCase();}

  async function lookupWines(query){
    const base=apiBase();if(!base)throw new Error("no-backend");
    const res=await fetch(base+"/api/wine-search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query})});
    if(!res.ok)throw new Error("Backend "+res.status);
    const data=await res.json();return Array.isArray(data.wines)?data.wines:[];
  }

  // ---- quick log ----
  async function parseLog(text){
    const base=apiBase();if(!base)throw new Error("no-backend");
    const counters=state.counters.map(c=>({label:c.label,subs:c.subs.map(s=>s.name),muligeTyper:c.suggest||[]}));
    const wines=state.wines.map(w=>w.name).filter(Boolean);
    const _ctrl=new AbortController();const _to=setTimeout(()=>_ctrl.abort(),8000);
    try{const res=await fetch(base+"/api/parse-log",{signal:_ctrl.signal,method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,counters,wines})});clearTimeout(_to);if(!res.ok)throw new Error("Backend "+res.status);const data=await res.json();return Array.isArray(data.actions)?data.actions:[];}
    catch(e){clearTimeout(_to);throw e;}
  }
  function findCounter(name){const n=(name||"").toLowerCase();return state.counters.find(c=>c.label.toLowerCase()===n)||state.counters.find(c=>c.label.toLowerCase().includes(n)||n.includes(c.label.toLowerCase()));}
  function addToSub(c,subName,delta,summary){
    const canon=(c.suggest||[]).find(x=>x.toLowerCase()===subName.toLowerCase())||subName;
    let s=c.subs.find(x=>x.name.toLowerCase()===canon.toLowerCase());
    if(!s){if(c.subs.length===0&&c.count>0){c.subs.push({id:id(),name:"Uden type",count:c.count});c.count=0;}s={id:id(),name:canon,count:0};c.subs.push(s);if(!c.suggest.some(x=>x.toLowerCase()===canon.toLowerCase()))c.suggest.push(canon);}
    s.count=Math.max(0,s.count+delta);
    summary.push((delta>0?"+":"")+delta+" "+canon+" ("+c.label+")");
  }
  function applyOne(a,summary,syncItems){
    if(a.kind==="counter"){
      const delta=parseInt(a.delta,10)||0;if(delta===0)return;
      let c=findCounter(a.counter);
      if(!c){c={id:id(),label:a.counter||"Ny tæller",count:0,subs:[],suggest:seedFor(a.counter)};state.counters.push(c);}
      const subName=(a.sub||"").trim();
      if(subName){addToSub(c,subName,delta,summary);}
      else if(c.subs.length){let s=c.subs.find(x=>x.name==="Uden type");if(!s){s={id:id(),name:"Uden type",count:0};c.subs.push(s);}s.count=Math.max(0,s.count+delta);summary.push((delta>0?"+":"")+delta+" "+c.label);}
      else{c.count=Math.max(0,c.count+delta);summary.push((delta>0?"+":"")+delta+" "+c.label);}
      if(syncItems)syncItems.push({categoryLabel:c.label,delta});
    }else if(a.kind==="wine"){
      const delta=parseInt(a.delta,10)||0;if(delta===0)return;
      const measure=a.measure==="bottles"?"bottles":"glasses";
      const nm=(a.wine||"").toLowerCase();
      let w=state.wines.find(x=>x.name.toLowerCase()===nm)||state.wines.find(x=>x.name&&(x.name.toLowerCase().includes(nm)||nm.includes(x.name.toLowerCase())));
      if(!w){w={id:id(),name:a.wine||"Ukendt vin",producer:a.producer||"",land:a.country||"",region:a.region||"",grape:a.grape||"",vint:"",glasses:0,bottles:0};state.wines.unshift(w);}
      w[measure]=Math.max(0,(w[measure]||0)+delta);
      summary.push((delta>0?"+":"")+delta+" "+(measure==="bottles"?t("bottles").toLowerCase():t("glasses").toLowerCase())+" "+w.name);
    }
  }
  const STOPVERBS=new Set(["jeg","har","i","dag","idag","åbnet","åbnede","åbent","snittet","skåret","skar","hakket","serveret","stegt","grillet","lavet","lavede","poleret","polerede","drukket","smagt","tilberedt","til","en","et","af","med","og","stk","styk","styks","portioner","portion","glas","stykker","have","has","opened","open","cut","chopped","served","grilled","made","polished","drank","tasted","prepared","to","a","an","of","with","and","pcs","pieces","portions","glasses","i"]);
  function localParse(text){
    const clauses=text.split(/\s+og\s+|\s+and\s+|,/i);const actions=[];
    clauses.forEach(cl=>{
      const low=cl.toLowerCase();const nm=low.match(/\d+/);const delta=nm?parseInt(nm[0],10):1;
      let best=null;
      state.counters.forEach(c=>{[...(c.suggest||[]),...c.subs.map(s=>s.name)].forEach(cand=>{if(cand&&low.includes(cand.toLowerCase())&&(!best||cand.length>best.sub.length))best={counter:c.label,sub:cand};});});
      if(best){actions.push({kind:"counter",counter:best.counter,sub:best.sub,delta});return;}
      let wine=null;state.wines.forEach(w=>{if(w.name&&low.includes(w.name.toLowerCase())&&(!wine||w.name.length>wine.length))wine=w.name;});
      if(wine){actions.push({kind:"wine",wine,measure:/flask|bottle/.test(low)?"bottles":"glasses",delta});return;}
      let cnt=null;state.counters.forEach(c=>{c.label.toLowerCase().split(/\s+/).filter(w=>w.length>=3&&!STOPVERBS.has(w)).forEach(w=>{if(low.includes(w)&&(!cnt||w.length>cnt.len))cnt={label:c.label,len:w.length};});});
      if(cnt){actions.push({kind:"counter",counter:cnt.label,sub:"",delta});return;}
      const numMatch=low.search(/\d/);
      const nameStr=numMatch>=0?low.slice(numMatch).replace(/^\d+\s*/,""):low;
      const words=nameStr.split(/\s+/).filter(w=>w&&!STOPVERBS.has(w));
      if(words.length){const raw=words.join(" ");actions.push({kind:"counter",counter:raw.charAt(0).toUpperCase()+raw.slice(1),sub:"",delta});}
    });
    return actions;
  }
  let toastTimer=null,undoSnapshot=null;
  function showToast(msg){
    clearTimeout(toastTimer);$("#toastMsg").textContent=msg;
    const toast=$("#toast");toast.classList.add("show");
    toastTimer=setTimeout(()=>toast.classList.remove("show"),6500);
  }
  $("#toastUndo").addEventListener("click",()=>{if(undoSnapshot){state=undoSnapshot;undoSnapshot=null;save();renderCounters();renderWines();renderCareer();}$("#toast").classList.remove("show");});
  async function runQuickLog(){
    const input=$("#qlogInput");const text=input.value.trim();if(!text)return;
    $("#qlogSpin").hidden=false;input.disabled=true;
    let actions=[];
    try{actions=await parseLog(text);}catch(e){console.warn("AI parse unavailable:",e);}
    if(!actions.length)actions=localParse(text);
    $("#qlogSpin").hidden=true;input.disabled=false;
    if(!actions.length){showToast(t("toast_unknown"));input.focus();return;}
    undoSnapshot=clone(state);
    const summary=[],ask=[],syncItems=[];
    actions.forEach(a=>{if(a.kind==="counter"&&!findCounter(a.counter))ask.push(a);else applyOne(a,summary,syncItems);});
    input.value="";save();renderCounters();renderWines();renderCareer();
    if(!ask.length){finishLog(summary,syncItems);return;}
    processAsk(ask,0,summary,syncItems);
  }
  function finishLog(summary,syncItems){
    const msg=summary.length?(t("toast_logged")+summary.join(", ")):t("toast_nothing");
    showToast(msg);if(summary.length)addLogEntry(summary.join(" · "));
    if(syncItems&&syncItems.length)syncItems.forEach(s=>syncLogEntry(s.categoryLabel,s.delta));
    $("#qlogInput").focus();
  }
  function processAsk(ask,i,summary,syncItems){if(i>=ask.length){finishLog(summary,syncItems);return;}openAsk(ask[i],()=>processAsk(ask,i+1,summary,syncItems),summary,syncItems);}
  function openAsk(item,next,summary,syncItems){
    const delta=parseInt(item.delta,10)||0;
    const detectedName=item.counter||"Ny ting";
    $("#askText").innerHTML='<b>'+esc((delta>0?"+":"")+delta+" "+detectedName)+'</b> '+esc(t("ask_no_match"));
    const nameInput=$("#askName");nameInput.value=detectedName;
    const sel=$("#askParent");sel.innerHTML=state.counters.map(c=>'<option value="'+c.id+'">'+esc(tLabel(c.label))+'</option>').join("");
    document.querySelector('input[name="askmode"][value="counter"]').checked=true;sel.disabled=true;
    const scrim=$("#askScrim");
    scrim._askSkip=()=>{scrim.classList.remove("open");scrim._askSkip=null;next();};
    scrim.classList.add("open");setTimeout(()=>nameInput.focus(),30);
    $("#askAdd").onclick=()=>{
      const name=(nameInput.value||"").trim()||detectedName;
      const mode=document.querySelector('input[name="askmode"]:checked').value;
      if(mode==="sub"){const parent=state.counters.find(c=>c.id===sel.value);if(parent)addToSub(parent,name,delta,summary);}
      else{const c={id:id(),label:name,count:0,subs:[],suggest:seedFor(name)};state.counters.push(c);const subName=(item.sub||"").trim();if(subName)addToSub(c,subName,delta,summary);else{c.count=Math.max(0,delta);summary.push((delta>0?"+":"")+delta+" "+c.label);if(syncItems)syncItems.push({categoryLabel:name,delta});}}
      save();renderCounters();renderWines();renderCareer();scrim._askSkip=null;scrim.classList.remove("open");next();
    };
    $("#askSkip").onclick=()=>{if(scrim._askSkip)scrim._askSkip();};
  }
  document.querySelectorAll('input[name="askmode"]').forEach(r=>r.addEventListener("change",()=>{$("#askParent").disabled=document.querySelector('input[name="askmode"]:checked').value!=="sub";}));
  $("#qlogInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runQuickLog();}});

  document.querySelectorAll(".scrim").forEach(s=>s.addEventListener("click",e=>{if(e.target===s){if(s._askSkip)s._askSkip();else s.classList.remove("open");}}));
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      if(numtray.classList.contains("open")){closeNumtray();return;}
      document.querySelectorAll(".scrim.open").forEach(s=>{if(s._askSkip)s._askSkip();else s.classList.remove("open");});
    }
  });
  document.querySelectorAll(".tab").forEach(tb=>tb.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));tb.classList.add("active");
    const v=tb.dataset.view;
    ["station","log","vin"].forEach(n=>$("#view-"+n).classList.toggle("active",v===n));
    $("#viewToggle").style.display=v==="station"?"":"none";
    if(v==="log")renderLogView();
  }));

  function startApp(){
    $("#view-station").classList.add("active");
    renderCounters();renderWines();renderCareer();renderLogView();
  }

  (async function(){
    document.querySelector(".wrap").style.display="none";
    state=await load();if(!Array.isArray(state.log))state.log=[];
    $("#loading").style.display="none";
    translateUI();
    setupAuthForm();
    const authed=await initAuth();
    if(authed)startApp();
  })();
})();
</script>
<script>
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }
</script>
